name: Flutter tests

on:
  push:
    branches:
      - main
      - feature/mimi-study-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Flutter tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test
